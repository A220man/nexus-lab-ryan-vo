[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-lab-ryan-vo"
version = "1.1.0"
description = "Persistent Context Across Sessions for Every Agent — AI/ML developer tool for cross-session memory"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
maintainers = [
    {name = "Ryan Vo", email = "ryandtvo@gmail.com"}
]
keywords = ["ai", "ml", "agent", "memory", "context", "coding-assistant", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30.0,<0.31",
    "fastapi>=0.115.0,<0.116",
    "uvicorn[standard]>=0.32.0,<0.33",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.13.0,<1.14",
    "pydantic>=2.9.0,<2.10",
    "pydantic-settings>=2.5.0,<2.6",
    "python-jose[cryptography]>=3.3.0,<3.4",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "python-multipart>=0.0.9,<0.1",
    "httpx>=0.27.0,<0.28",
    "chromadb>=0.5.0,<0.6",
    "sentence-transformers>=3.1.0,<3.2",
    "python-dotenv>=1.0.0,<1.1",
    "psycopg2-binary>=2.9.9,<2.10",
    "structlog>=24.1.0,<25",
    "tenacity>=8.3.0,<9",
    "prometheus-client>=0.19.0,<0.20",
]
optional-dependencies = {dev = ["pytest>=8.3.0,<9", "pytest-asyncio>=0.23.0,<0.24", "pytest-cov>=5.0.0,<6", "httpx>=0.27.0,<0.28", "faker>=25.0.0,<26", "ruff>=0.6.0,<0.7", "mypy>=1.11.0,<1.12"]}

[project.urls]
Homepage = "https://github.com/A220man/nexus-lab-ryan-vo"
Repository = "https://github.com/A220man/nexus-lab-ryan-vo"
Issues = "https://github.com/A220man/nexus-lab-ryan-vo/issues"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["backend"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "W", "UP", "B", "C4", "PTH", "SIM", "T20"]
ignore = ["S101", "S311", "B008"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict = true
exclude = ["backend/tests/**"]