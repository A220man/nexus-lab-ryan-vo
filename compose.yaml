services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-lab-postgres
    environment:
      POSTGRES_DB: nexus_lab
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nexus-lab-network

  chroma:
    image: chromadb/chroma:0.5.5
    container_name: nexus-lab-chroma
    environment:
      CHROMA_SERVER_HOST: 0.0.0.0
      CHROMA_SERVER_HTTP_PORT: 8000
      ALLOW_RESET: "true"
    volumes:
      - chroma_data:/data
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-lab-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: nexus-lab-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: dev-file
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/nexus-lab HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q 'HTTP/1.[01] 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nexus-lab-network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nexus-lab-backend
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus_lab
      SECRET_KEY: ${SECRET_KEY}
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: nexus-lab
      KEYCLOAK_CLIENT_ID: nexus-lab
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      CHROMA_URL: http://chroma:8000
      DEMO_MODE: ${DEMO_MODE:-false}
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-lab-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: nexus-lab-frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexus-lab-network

volumes:
  postgres_data:
  chroma_data:
  keycloak_data:

networks:
  nexus-lab-network:
    driver: bridge