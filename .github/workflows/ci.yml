name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: sqlite:///./test.db
  SECRET_KEY: test-secret-key-for-ci-testing-only-32chars
  KEYCLOAK_URL: http://localhost:8080
  KEYCLOAK_REALM: nexus-lab
  KEYCLOAK_CLIENT_ID: nexus-lab
  KEYCLOAK_CLIENT_SECRET: change-me-in-production
  LLM_API_KEY: ""
  LLM_PROVIDER: openai-compatible
  LLM_MODEL: gpt-4o-mini
  LLM_BASE_URL: https://api.openai.com/v1
  CHROMA_URL: http://localhost:8001
  DEMO_MODE: "true"
  FRONTEND_URL: http://localhost:5173
  LOG_LEVEL: DEBUG

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexus_lab
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U nexus -d nexus_lab"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r backend/requirements.txt

      - name: Run backend tests
        run: |
          .venv/bin/pytest backend/tests -v --tb=short
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_lab

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run typecheck
        run: |
          cd frontend
          npm run build 2>&1 | head -50

      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-test, frontend-test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: nexus-lab-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: nexus-lab-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test backend image health
        run: |
          docker run -d --name backend-test \
            -e DATABASE_URL=sqlite:///./test.db \
            -e SECRET_KEY=test-secret-key-for-ci-testing-only-32chars \
            -e KEYCLOAK_URL=http://host.docker.internal:8080 \
            -e KEYCLOAK_REALM=nexus-lab \
            -e KEYCLOAK_CLIENT_ID=nexus-lab \
            -e KEYCLOAK_CLIENT_SECRET=change-me-in-production \
            -e DEMO_MODE=true \
            -p 8000:8000 \
            nexus-lab-backend:test
          sleep 10
          curl -f http://localhost:8000/api/health
          docker logs backend-test
          docker stop backend-test
          docker rm backend-test

  compose-integration:
    name: Compose Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [docker-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start services
        run: |
          docker compose up -d --wait
        env:
          SECRET_KEY: test-secret-key-for-ci-testing-only-32chars
          KEYCLOAK_CLIENT_SECRET: change-me-in-production

      - name: Verify health endpoints
        run: |
          sleep 15
          curl -f http://localhost:8000/api/health
          curl -f http://localhost:5173

      - name: Run integration smoke test
        run: |
          curl -f http://localhost:8000/api/readiness
          curl -f http://localhost:8000/api/health | grep -q '"status":"ok"'

      - name: Show logs on failure
        if: failure()
        run: |
          docker compose logs --tail=100

      - name: Cleanup
        if: always()
        run: |
          docker compose down -v